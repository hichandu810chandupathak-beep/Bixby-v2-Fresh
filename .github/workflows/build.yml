name: Bixby Fresh Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/bixby-ai-fresh"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Check Gemini secret status
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY is not configured. APK will still be built, but Gemini AI requests will not work until the repository secret is added."
          else
            echo "GEMINI_API_KEY is available to the build environment."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            gradle assembleDebug -PGEMINI_API_KEY="$GEMINI_API_KEY"
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bixby-v2-fresh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
